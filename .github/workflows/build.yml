name: Build OpenWrt H28K

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'configs/**'
      - 'feeds.conf.default'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: openwrt-h28k
  cancel-in-progress: true

env:
  OPENWRT_REF: v25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk             gcc-multilib g++-multilib gettext git             libncurses5-dev libssl-dev python3-setuptools             python3-pyelftools python3-dev python3-venv             rsync swig unzip zlib1g-dev file wget curl             xsltproc libelf-dev ccache

          python3 -c 'from elftools.elf.elffile import ELFFile; print("pyelftools OK")'

      - name: Cache OpenWrt downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            work/openwrt/dl
            ~/.ccache
          key: openwrt-${{ env.OPENWRT_REF }}-${{ runner.arch }}-${{ hashFiles('configs/seed.config', 'feeds.conf.default', 'scripts/*.sh') }}
          restore-keys: |
            openwrt-${{ env.OPENWRT_REF }}-${{ runner.arch }}-

      - name: Build
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Generate checksums
        run: |
          cd output
          find . -type f \( -name '*.img.gz' -o -name '*.tar.gz' -o -name '*.manifest' \) -print0 |
            xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-h28k-firmware
          path: output/**
          retention-days: 30
